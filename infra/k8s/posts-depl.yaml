apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts
  template:
    metadata:
      labels:
        app: posts
    spec:
      containers:
        - name: posts
          image: codeshannon/mini-microservice-app-posts
          ports:
            - containerPort: 4000
          # env:
          #   - name: POSTS_DB_HOST
          #     value: "posts-db"
          #   - name: POSTS_DB_PORT
          #     value: "5432"
