apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
        - name: query-service
          image: codeshannon/mini-microservice-app-query-service
          ports:
            - containerPort: 4002
---
apiVersion: v1
kind: Service
metadata:
  name: query-clusterip-srv
spec:
  type: ClusterIP
  selector:
    app: query-service
  ports:
    - name: query-service
      protocol: TCP
      port: 4002
      targetPort: 4002
